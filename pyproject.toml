[project]
name = "step-functions-orders-demo"
version = "0.1.0"
description = "Merchant approval, stock reservation, and payment through AWS Step Functions"
requires-python = ">=3.10"
dependencies = [
    "aws-lambda-powertools[parser]>=3,<4",
    "boto3>=1.43,<2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2,<3",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --junitxml=output/junit.xml"

[tool.coverage.run]
branch = true
core = "sysmon"
source = ["src"]
data_file = "output/coverage/.coverage"
relative_files = true
parallel = true
context = "${COVERAGE_CONTEXT-}"

[tool.coverage.paths]
source = ["src", "/var/task/src"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.coverage.html]
directory = "output/htmlcov"
show_contexts = true

[tool.coverage.json]
output = "output/coverage.json"
show_contexts = true

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,lambda,sqs,stepfunctions]>=1.43,<2",
    "coverage>=7.16.2,<8",
    "pyright>=1.1.411,<2",
    "pytest>=8,<10",
    "ruff>=0.17,<1",
    "testcontainers>=4,<5",
    "types-docker>=7,<8",
]
runtime = [
    "coverage>=7.16.2,<8",
]
